<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple One-Page Website</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="#" class="brand">MySite</a>
        <nav class="site-nav">
          <a href="#home">Home</a>
          <a href="#about">About</a>
          <a href="#contact">Contact</a>
        </nav>
        <div class="account-icon" aria-label="Account">
          <span>👤</span>
        </div>
      </div>
    </header>

    <main class="page-container">
      <section id="home" class="hero">
        <h1>Welcome to Your Simple Website</h1>
        <p>This is a clean one-page layout built with HTML, CSS, and JavaScript.</p>
        <button id="actionButton">Click Me</button>
        <p id="message" class="message"></p>
      </section>

      <section class="info-block">
        <h2>About This Page</h2>
        <p>
          This page shows a responsive layout, simple styling, and an interactive button.
          Use the button to see JavaScript in action.
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
